<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Menards Store Map Viewer</title>
<style>
  :root {
    --menards-green: #006847;
    --menards-green-dark: #004b32;
    --menards-orange: #ff671d;
    --bg: #f2f3f3;
    --card-bg: #ffffff;
    --text: #1f1f1f;
    --muted: #666;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 100vh;
  }
  #app-header {
    background: var(--menards-green);
    color: #fff;
    padding: 14px 16px;
    flex: 0 0 auto;
  }
  #app-header h1 {
    margin: 0;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .screen {
    display: none;
    flex: 1 1 auto;
    min-height: 0;
    flex-direction: column;
    padding: 16px;
    overflow-y: auto;
  }
  .screen.active { display: flex; }

  /* ---------- Screen 1: store entry ---------- */
  #screen-input { align-items: stretch; justify-content: flex-start; gap: 16px; max-width: 480px; margin: 0 auto; width: 100%; }
  #store-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--card-bg);
    padding: 20px;
    border-radius: var(--radius);
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  #store-form label { font-weight: 600; font-size: 0.95rem; }
  #store-number {
    font-size: 1.4rem;
    padding: 14px;
    border: 2px solid #ccc;
    border-radius: 10px;
    text-align: center;
    letter-spacing: 1px;
  }
  #store-number:focus { outline: none; border-color: var(--menards-green); }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
  }
  #store-form button[type="submit"] {
    background: var(--menards-orange);
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 14px;
  }
  #store-form button[type="submit"]:active { opacity: 0.85; }
  .error {
    color: #b3261e;
    background: #fde7e5;
    border: 1px solid #f3b4ae;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    margin: 0;
  }
  #recent-stores { display: flex; flex-direction: column; gap: 8px; }
  #recent-stores h3 { margin: 0; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #recent-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: #fff;
    border: 1px solid #ddd;
    padding: 10px 16px;
    border-radius: 999px;
    font-weight: 600;
  }
  .chip:active { background: #eaeaea; }

  /* ---------- Screen 2: map list ---------- */
  .list-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .list-header h2 { margin: 0; font-size: 1.15rem; flex: 1 1 auto; }
  .btn-secondary {
    background: #fff;
    border: 1px solid #ccc;
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text);
  }
  .btn-secondary:active { background: #e9e9e9; }
  #map-cards { display: flex; flex-direction: column; gap: 14px; }
  .map-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .map-card h3 { margin: 0 0 10px 0; font-size: 1rem; }
  .map-card .variant-row { display: flex; gap: 10px; }
  .variant-btn {
    flex: 1 1 0;
    background: var(--menards-green);
    color: #fff;
    padding: 12px 10px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .variant-btn:active { background: var(--menards-green-dark); }
  .variant-btn.missing { background: #ddd; color: #999; }

  /* ---------- Screen 3: viewer ---------- */
  #screen-viewer { padding: 0; }
  .viewer-toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--menards-green);
  }
  .viewer-toolbar .btn-secondary { padding: 8px 12px; font-size: 0.85rem; }
  #viewer-title {
    flex: 1 1 auto;
    color: #fff;
    font-weight: 700;
    text-align: center;
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #viewer-stage {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    touch-action: none;
    background: #dadada;
    position: relative;
  }
  #viewer-img {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    user-select: none;
    -webkit-user-drag: none;
    max-width: none;
  }
  .viewer-controls {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 10px;
    background: #fff;
    border-top: 1px solid #ddd;
  }
  .viewer-controls button {
    background: var(--menards-orange);
    color: #fff;
    width: 56px;
    height: 44px;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .viewer-controls button:active { opacity: 0.85; }
  .viewer-controls #zoom-reset { width: auto; padding: 0 16px; font-size: 0.9rem; }

  @media (min-width: 700px) {
    #map-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  }
</style>
</head>
<body>
<div id="app">
  <header id="app-header">
    <h1>Menards Store Map Viewer</h1>
  </header>

  <!-- SCREEN 1: store number entry -->
  <section id="screen-input" class="screen active">
    <form id="store-form">
      <label for="store-number">Enter Store Number</label>
      <input type="text" id="store-number" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 3011" autocomplete="off" maxlength="6">
      <button type="submit">Find Maps</button>
    </form>
    <p id="input-error" class="error" hidden></p>
    <div id="recent-stores" hidden>
      <h3>Recent Stores</h3>
      <div id="recent-chips"></div>
    </div>
  </section>

  <!-- SCREEN 2: list of maps for the store -->
  <section id="screen-list" class="screen">
    <div class="list-header">
      <button id="btn-change-store" class="btn-secondary" type="button">&larr; Change Store</button>
      <h2 id="list-store-title"></h2>
    </div>
    <div id="map-cards"></div>
  </section>

  <!-- SCREEN 3: SVG viewer -->
  <section id="screen-viewer" class="screen">
    <div class="viewer-toolbar">
      <button id="btn-back-list" class="btn-secondary" type="button">&larr; Back</button>
      <span id="viewer-title"></span>
      <button id="btn-change-store-2" class="btn-secondary" type="button">Change Store</button>
    </div>
    <div id="viewer-stage">
      <img id="viewer-img" draggable="false" alt="Store map">
    </div>
    <div class="viewer-controls">
      <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
      <button id="zoom-reset" type="button" aria-label="Reset zoom">Reset</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">&plus;</button>
    </div>
  </section>
</div>

const MAPS_DIR = "Menards_Maps/";
const RECENT_KEY = "menards_recent_stores";
const RECENT_MAX = 6;

const SECTION_LABELS = {
  MAIN: "Main Floor",
  FLOOR1: "Floor 1",
  FLOOR2: "Floor 2",
  ANNEX: "Annex",
  OUTSIDE: "Outside / Yard"
};
const SECTION_ORDER = ["MAIN", "FLOOR1", "FLOOR2", "ANNEX", "OUTSIDE"];

function sectionLabel(key) {
  return SECTION_LABELS[key] || key.charAt(0) + key.slice(1).toLowerCase();
}

function sortedSections(sections) {
  return Object.keys(sections).sort((a, b) => {
    const ia = SECTION_ORDER.indexOf(a);
    const ib = SECTION_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}

// ---------- Screen management ----------
const screens = {
  input: document.getElementById("screen-input"),
  list: document.getElementById("screen-list"),
  viewer: document.getElementById("screen-viewer")
};
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
}

// ---------- Recent stores ----------
function getRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; }
  catch (e) { return []; }
}
function addRecent(store) {
  let recent = getRecent().filter(s => s !== store);
  recent.unshift(store);
  recent = recent.slice(0, RECENT_MAX);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); } catch (e) {}
}
function renderRecent() {
  const recent = getRecent();
  const wrap = document.getElementById("recent-stores");
  const chips = document.getElementById("recent-chips");
  chips.innerHTML = "";
  if (!recent.length) { wrap.hidden = true; return; }
  wrap.hidden = false;
  recent.forEach(store => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.textContent = store;
    btn.addEventListener("click", () => lookupStore(store));
    chips.appendChild(btn);
  });
}

// ---------- Store lookup / list screen ----------
let currentStore = null;

function lookupStore(rawValue) {
  const store = String(rawValue).trim().replace(/\D/g, "");
  const errorEl = document.getElementById("input-error");
  errorEl.hidden = true;
  if (!store) {
    errorEl.textContent = "Please enter a store number.";
    errorEl.hidden = false;
    return;
  }
  const data = MANIFEST[store];
  if (!data) {
    errorEl.textContent = "No maps found for store #" + store + ". Check the number and try again.";
    errorEl.hidden = false;
    return;
  }
  currentStore = store;
  addRecent(store);
  renderMapList(store, data);
  showScreen("list");
}

function renderMapList(store, data) {
  document.getElementById("list-store-title").textContent = "Store #" + store;
  const container = document.getElementById("map-cards");
  container.innerHTML = "";
  sortedSections(data).forEach(sectionKey => {
    const variants = data[sectionKey];
    const card = document.createElement("div");
    card.className = "map-card";
    const h3 = document.createElement("h3");
    h3.textContent = sectionLabel(sectionKey);
    card.appendChild(h3);
    const row = document.createElement("div");
    row.className = "variant-row";
    ["General", "Detailed"].forEach(variant => {
      const entry = variants[variant];
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = variant;
      if (entry) {
        btn.className = "variant-btn";
        btn.addEventListener("click", () => openViewer(store, sectionKey, variant, entry));
      } else {
        btn.className = "variant-btn missing";
        btn.disabled = true;
      }
      row.appendChild(btn);
    });
    card.appendChild(row);
    container.appendChild(card);
  });
}

// ---------- Viewer screen with pan/zoom ----------
const viewerImg = document.getElementById("viewer-img");
const viewerStage = document.getElementById("viewer-stage");
const viewerTitle = document.getElementById("viewer-title");

let scale = 1, posX = 0, posY = 0;
let imgW = 0, imgH = 0;
const MIN_SCALE = 0.5, MAX_SCALE = 8;

function applyTransform() {
  viewerImg.style.transform = "translate(" + posX + "px," + posY + "px) scale(" + scale + ")";
}

function resetView() {
  // Fit image to stage based on the SVG's real viewBox size (img.naturalWidth is
  // unreliable here since these SVGs have no width/height attributes).
  const stageRect = viewerStage.getBoundingClientRect();
  const iw = imgW || stageRect.width;
  const ih = imgH || stageRect.height;
  const fitScale = Math.min(stageRect.width / iw, stageRect.height / ih);
  scale = fitScale > 0 ? fitScale : 1;
  posX = (stageRect.width - iw * scale) / 2;
  posY = (stageRect.height - ih * scale) / 2;
  applyTransform();
}

function openViewer(store, sectionKey, variant, entry) {
  viewerTitle.textContent = "Store #" + store + " \u2013 " + sectionLabel(sectionKey) + " (" + variant + ")";
  imgW = entry.w || 0;
  imgH = entry.h || 0;
  // Set explicit pixel size so the SVG renders at full vector resolution
  // instead of the browser's tiny default replaced-element size.
  viewerImg.width = imgW || 1000;
  viewerImg.height = imgH || 1000;
  viewerImg.src = MAPS_DIR + entry.f;
  viewerImg.onload = resetView;
  showScreen("viewer");
}

function clampScale(s) {
  return Math.max(MIN_SCALE, Math.min(MAX_SCALE, s));
}

function zoomAtPoint(factor, clientX, clientY) {
  const rect = viewerStage.getBoundingClientRect();
  const originX = clientX - rect.left;
  const originY = clientY - rect.top;
  const newScale = clampScale(scale * factor);
  const ratio = newScale / scale;
  posX = originX - (originX - posX) * ratio;
  posY = originY - (originY - posY) * ratio;
  scale = newScale;
  applyTransform();
}

// Pointer-based pan & pinch-zoom
const pointers = new Map();
let lastDist = null;
let lastMid = null;
let dragStart = null;

function midpoint(p1, p2) {
  return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
}
function distance(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

viewerStage.addEventListener("pointerdown", e => {
  viewerStage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    dragStart = { x: e.clientX, y: e.clientY, posX, posY };
  } else if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    lastDist = distance(pts[0], pts[1]);
    lastMid = midpoint(pts[0], pts[1]);
    dragStart = null;
  }
});

viewerStage.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1 && dragStart) {
    posX = dragStart.posX + (e.clientX - dragStart.x);
    posY = dragStart.posY + (e.clientY - dragStart.y);
    applyTransform();
  } else if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    const dist = distance(pts[0], pts[1]);
    const mid = midpoint(pts[0], pts[1]);
    if (lastDist) {
      const factor = dist / lastDist;
      zoomAtPoint(factor, mid.x, mid.y);
    }
    if (lastMid) {
      posX += mid.x - lastMid.x;
      posY += mid.y - lastMid.y;
      applyTransform();
    }
    lastDist = dist;
    lastMid = mid;
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) { lastDist = null; lastMid = null; }
  if (pointers.size === 1) {
    const [remaining] = pointers.values();
    dragStart = { x: remaining.x, y: remaining.y, posX, posY };
  } else if (pointers.size === 0) {
    dragStart = null;
  }
}
viewerStage.addEventListener("pointerup", endPointer);
viewerStage.addEventListener("pointercancel", endPointer);
viewerStage.addEventListener("pointerleave", endPointer);

// Mouse wheel zoom (desktop)
viewerStage.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  zoomAtPoint(factor, e.clientX, e.clientY);
}, { passive: false });

// Double-click / double-tap to toggle zoom
let lastTapTime = 0;
viewerStage.addEventListener("pointerup", e => {
  const now = Date.now();
  if (now - lastTapTime < 300 && pointers.size === 0) {
    const targetScale = scale < 2 ? 2.5 : 1;
    zoomAtPoint(targetScale / scale, e.clientX, e.clientY);
  }
  lastTapTime = now;
});

document.getElementById("zoom-in").addEventListener("click", () => {
  const rect = viewerStage.getBoundingClientRect();
  zoomAtPoint(1.3, rect.left + rect.width / 2, rect.top + rect.height / 2);
});
document.getElementById("zoom-out").addEventListener("click", () => {
  const rect = viewerStage.getBoundingClientRect();
  zoomAtPoint(1 / 1.3, rect.left + rect.width / 2, rect.top + rect.height / 2);
});
document.getElementById("zoom-reset").addEventListener("click", resetView);

// ---------- Navigation wiring ----------
document.getElementById("store-form").addEventListener("submit", e => {
  e.preventDefault();
  lookupStore(document.getElementById("store-number").value);
});
document.getElementById("btn-change-store").addEventListener("click", () => {
  document.getElementById("store-number").value = "";
  document.getElementById("input-error").hidden = true;
  renderRecent();
  showScreen("input");
});
document.getElementById("btn-change-store-2").addEventListener("click", () => {
  document.getElementById("store-number").value = "";
  document.getElementById("input-error").hidden = true;
  renderRecent();
  showScreen("input");
});
document.getElementById("btn-back-list").addEventListener("click", () => {
  showScreen("list");
});
window.addEventListener("resize", () => {
  if (screens.viewer.classList.contains("active")) resetView();
});

renderRecent();
</script>
